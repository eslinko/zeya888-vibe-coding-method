<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Backlog Dashboard</title>
  <style>
    :root {
      --bg-primary: #0a1420;
      --bg-panel: #181715;
      --bg-panel-hover: #1f1d1a;
      --doge-gold: #eca125;
      --doge-light-gold: #fce3ae;
      --text-primary: #f3f4f6;
      --text-muted: #9ca3af;
      --border: #2d3748;
      --success: #22c55e;
      --warning: #f59e0b;
      --error: #ef4444;
      --status-done: #22c55e;
      --status-progress: #3b82f6;
      --status-todo: #9ca3af;
      --font-ui: "Inter", system-ui, -apple-system, sans-serif;
      --font-mono: "JetBrains Mono", "SF Mono", Consolas, monospace;
      --max-width: 1320px;
      --outer-pad: 48px;
      --accordion-gap: 20px;
      --transition-accordion: 150ms ease;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-ui);
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.5;
    }

    .page {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: var(--outer-pad);
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 32px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }

    .header__brand { display: flex; align-items: center; gap: 12px; }
    .header__logo { font-size: 28px; line-height: 1; }
    .header__title { font-size: 24px; font-weight: 600; }
    .header__subtitle {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .header__pills { display: flex; gap: 8px; flex-wrap: wrap; }
    .pill {
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 999px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      color: var(--doge-light-gold);
    }
    .pill--stale { color: var(--warning); border-color: var(--warning); }

    .global-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 20px;
    }
    .stat-card__label {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .stat-card__value {
      font-size: 28px;
      font-weight: 600;
      color: var(--doge-gold);
      margin-top: 4px;
    }

    .refresh-panel {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 20px;
      margin-bottom: 24px;
    }
    .refresh-panel__title {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .cli-row {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 14px;
    }
    .cli-row code {
      flex: 1;
      font-family: var(--font-mono);
      font-size: 13px;
      color: #60a5fa;
      word-break: break-all;
    }

    .copy-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--doge-gold);
      cursor: pointer;
      padding: 6px 10px;
      font-size: 14px;
      flex-shrink: 0;
    }
    .copy-btn:hover { background: var(--bg-panel-hover); }
    .copy-btn.is-copied { color: var(--success); border-color: var(--success); }

    .project-list {
      display: flex;
      flex-direction: column;
      gap: var(--accordion-gap);
    }

    .project-block {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .project-block__header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      cursor: pointer;
      user-select: none;
    }
    .project-block__header:hover { background: var(--bg-panel-hover); }

    .project-block__title {
      font-size: 18px;
      font-weight: 600;
      flex: 1;
    }

    .project-block__pct {
      font-family: var(--font-mono);
      font-size: 14px;
      color: var(--doge-gold);
    }

    .progress-bar {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    .project-block__body {
      padding: 0 20px 20px;
      border-top: 1px solid var(--border);
    }
    .project-block.is-collapsed .project-block__body { display: none; }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 16px 0;
      font-size: 13px;
      color: var(--text-muted);
    }
    .meta-row a { color: #60a5fa; }
    table.data-table a { color: #60a5fa; text-decoration: none; }
    table.data-table a:hover { text-decoration: underline; }

    .section-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      margin: 16px 0 8px;
    }

    table.data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    table.data-table th,
    table.data-table td {
      border: 1px solid var(--border);
      padding: 8px 10px;
      text-align: left;
    }
    table.data-table th {
      background: #0d1117;
      color: var(--text-muted);
      font-weight: 500;
    }

    .epic-chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .epic-chip {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #0d1117;
    }
    .epic-chip[data-status="Done"] { border-color: var(--status-done); color: var(--status-done); }
    .epic-chip[data-status="In Progress"] { border-color: var(--status-progress); color: var(--status-progress); }
    .epic-chip[data-status="Todo"] { border-color: var(--status-todo); color: var(--status-todo); }

    .waves-list {
      list-style: decimal;
      padding-left: 20px;
      font-size: 13px;
      color: var(--text-primary);
    }
    .waves-list li { margin-bottom: 6px; }

    .chevron {
      transition: transform var(--transition-accordion);
      color: var(--text-muted);
    }
    .project-block.is-collapsed .chevron { transform: rotate(-90deg); }

    @media (max-width: 768px) {
      .page { padding: 24px 16px; }
    }
  </style>
</head>

    function daysSince(dateStr) {
      if (!dateStr) return Infinity;
      const d = new Date(dateStr + 'T12:00:00Z');
      const now = new Date();
      return Math.floor((now - d) / (86400000));
    }

    function epicStatusKey(status) {
      const s = (status || '').toLowerCase();
      if (s.includes('done')) return 'Done';
      if (s.includes('progress')) return 'In Progress';
      return 'Todo';
    }

    function sortProjects(projects) {
      return [...projects].sort((a, b) => {
        const pa = a.summary?.progress_pct ?? 999;
        const pb = b.summary?.progress_pct ?? 999;
        return pa - pb;
      });

        { label: 'Total stories', value: global.total_stories },
        { label: 'Done', value: global.total_done },
        { label: 'Overall', value: global.overall_pct + '%' },
      ];
      el.innerHTML = cards
        .map(
          (c) =>
            `<div class="stat-card"><div class="stat-card__label">${c.label}</div><div class="stat-card__value">${c.value}</div></div>`,
        )
        .join('');

      const pills = document.getElementById('header-pills');
      const genDate = generatedAt ? generatedAt.slice(0, 10) : '—';
      pills.innerHTML = `
        <span class="pill">Theme: Dark + DOGE</span>
        <span class="pill">v1.0.0</span>
        <span class="pill">Generated: ${genDate}</span>
      `;
    }

    function resolvePackageHref(snapshotPath, packageLink) {
      if (!snapshotPath || !packageLink) return null;
      const baseDir = snapshotPath.replace(/\/[^/]+$/, '');
      const rel = packageLink.replace(/^\.\//, '');
      return `../../../../${baseDir}/${rel}`;
    }

    function renderPackageNameCell(pkg, snapshotPath) {
      const href = resolvePackageHref(snapshotPath, pkg.link);
      const name = escapeHtml(pkg.name);
      if (!href) return name;
      return `<a href="${escapeHtml(href)}" title="${escapeHtml(pkg.link)}">${name}</a>`;
    }

    function renderPackageTable(packages, snapshotPath) {
      if (!packages || packages.length === 0) return '<p class="meta-row">No packages</p>';
      const rows = packages
        .map((p) => {
          const prog =
            p.progress_bar ||
            (p.progress_pct != null ? `${p.progress_pct}%` : p.raw_progress || '—');
          return `<tr>
            <td>${renderPackageNameCell(p, snapshotPath)}</td>
            <td>${p.stories ?? '—'}</td>
            <td>${p.done ?? '—'}</td>
            <td>${p.todo ?? '—'}</td>
            <td class="progress-bar">${escapeHtml(prog)}</td>
          </tr>`;
        })
        .join('');
      return `<table class="data-table"><thead><tr>
        <th>Package</th><th>Stories</th><th>Done</th><th>Todo</th><th>Progress</th>
      </tr></thead><tbody>${rows}</tbody></table>`;
    }

    function renderEpics(epics) {
      if (!epics || epics.length === 0) return '';
      const chips = epics
        .map((e) => {
          const sk = epicStatusKey(e.status);
          return `<span class="epic-chip" data-status="${sk}" title="${escapeHtml(e.notes || '')}">${escapeHtml(e.name)} · ${escapeHtml(e.status)}</span>`;
        })
        .join('');
      return `<div class="section-title">Epic rollup</div><div class="epic-chips">${chips}</div>`;
    }

    function renderWaves(waves) {
      if (!waves || waves.length === 0) return '';
      const items = waves.map((w) => `<li>${escapeHtml(w)}</li>`).join('');
      return `<div class="section-title">Next recommended waves</div><ol class="waves-list">${items}</ol>`;
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function renderProjects(projects) {
      const list = document.getElementById('project-list');
      const sorted = sortProjects(projects);
      list.innerHTML = sorted
        .map((p, idx) => {
          const s = p.summary || {};
          const pct = s.progress_pct ?? '—';
          const bar = s.progress_bar || '';
          const stale = daysSince(p.updated) > STALE_DAYS;
          const collapsed = idx > 0 ? ' is-collapsed' : '';
          const stalePill = stale ? '<span class="pill pill--stale">stale</span>' : '';
          const snapLink = p.snapshot_path
            ? `<a href="../../../../${p.snapshot_path}">${escapeHtml(p.snapshot_path)}</a>`
            : '—';

          return `<article class="project-block${collapsed}" data-project="${escapeHtml(p.key)}">
            <div class="project-block__header" role="button" tabindex="0" aria-expanded="${idx === 0}">
              <span class="chevron">▼</span>
              <span class="project-block__title">${escapeHtml(p.label)}</span>
              ${stalePill}
              <span class="project-block__pct">${pct}%</span>
              <span class="progress-bar">${escapeHtml(bar)}</span>
            </div>
            <div class="project-block__body">
              <div class="meta-row">
                <span>Updated: ${p.updated || '—'}</span>
                <span>Stories: ${s.done ?? 0}/${s.stories ?? 0} done</span>
                <span>Snapshot: ${snapLink}</span>
              </div>
              <div class="section-title">By package</div>
              ${renderPackageTable(p.packages, p.snapshot_path)}
              ${renderEpics(p.epics)}
              ${renderWaves(p.next_waves)}
            </div>
          </article>`;
        })
        .join('');

      list.querySelectorAll('.project-block__header').forEach((header) => {
        const toggle = () => {
          const block = header.closest('.project-block');
          const collapsed = block.classList.toggle('is-collapsed');
          header.setAttribute('aria-expanded', String(!collapsed));
        };
        header.addEventListener('click', toggle);
        header.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            toggle();
          }
        });
      });
    }

    async function copyText(text) {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          return true;
        }
      } catch (_) { /* fallback */ }
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    }

    function init() {
      const data = typeof DASHBOARD_DATA !== 'undefined' ? DASHBOARD_DATA : { projects: [], global: {} };
      const subtitleEl = document.getElementById('header-subtitle');
      if (subtitleEl && data.projects && data.projects.length) {
        const keys = data.projects.map((p) => p.key).join(' · ');
        subtitleEl.textContent = `aggregated snapshot view — ${keys}`;
      }
      renderGlobal(data.global || {}, data.generated_at);
      renderProjects(data.projects || []);

      const copyBtn = document.getElementById('copy-refresh');
      copyBtn.addEventListener('click', async () => {
        await copyText(REFRESH_CMD);
        copyBtn.classList.add('is-copied');
        setTimeout(() => copyBtn.classList.remove('is-copied'), 1300);
      });
    }

    init();
  </script>
</body>
</html>
